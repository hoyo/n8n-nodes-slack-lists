# Publishes this n8n community node package to npm, with a provenance attestation.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required. Earlier versions do not support the
# provenance flag passed by `npm run release` in CI, and the publish step will
# fail. Check the version installed in this project with:
#
#   npm list @n8n/node-cli
#
# To upgrade:
#
#   npm install --save-dev @n8n/node-cli@latest
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# Publishing authenticates through npm OIDC Trusted Publishing — no long-lived
# secrets, so this repository holds no npm token. Set it up once on npmjs.com:
#
#   1. Log in to npmjs.com and open your package's settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: <your-github-username-or-org>
#        Repository name:  <your-repo-name>
#        Workflow name:    publish.yml
#        Environment:      (leave blank unless you use GitHub Environments)
#
# The trust is bound to this file's *name*, so the publish step has to stay in
# this workflow — that is why release.yml calls it instead of publishing itself.
# The same OIDC infrastructure signs the provenance attestation.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Releases run entirely on GitHub Actions: Actions → Release → Run workflow, and
# pick patch / minor / major. See release.yml — it bumps the version, regenerates
# the changelog, commits, tags, and then calls this workflow to publish.
#
# Tags are the bare version (e.g. 1.1.0), no "v" prefix — that is release-it's
# default, and this workflow takes whichever tag it is handed.

name: Publish

on:
  # The normal path: release.yml calls this right after it creates the tag.
  # (It has to call it explicitly — a tag pushed with GITHUB_TOKEN raises no
  # `push` event, as GitHub suppresses those to prevent workflow loops.)
  workflow_call:
    inputs:
      ref:
        description: Tag to check out and publish.
        type: string
        required: true

  # The recovery path: re-publish an existing tag by hand, for when release.yml
  # tagged successfully but the publish below failed. There is deliberately no
  # `push: tags` trigger — publishing must not be reachable by tagging alone,
  # which is how a release once reached npm without a changelog entry.
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to check out and publish (e.g. 1.1.0).
        type: string
        required: true

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always an explicit tag: on workflow_call the release job created it
          # moments ago, on workflow_dispatch it was typed in by hand.
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        # Publishes to npm with a provenance attestation (requires id-token: write
        # above). npm authenticates via the OIDC exchange, so there is no token to
        # configure. Lint and build run automatically as part of the release process.
        run: npm run release
